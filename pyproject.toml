[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboweather"
version = "0.1.0"
description = "Brutally simple MVP for same-day U.S. temperature market modeling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pygrib>=2.1",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
live = [
    "py-clob-client",
]

[tool.setuptools.packages.find]
include = ["weather_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
